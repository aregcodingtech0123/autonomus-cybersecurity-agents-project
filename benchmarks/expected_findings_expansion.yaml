  - id: P17
    target: shop_api
    kind: positive
    title: Payment webhook secret committed in an .env-style file
    file: deploy/prod.env
    line_start: 6
    line_end: 6
    anchor: PAYMENT_WEBHOOK_SECRET=
    cwe: CWE-798
    match:
      - {file: deploy/prod.env, line_start: 6, line_end: 6, cwe: [CWE-798]}
    rationale: >-
