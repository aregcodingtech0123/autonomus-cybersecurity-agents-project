# CI for secaudit.
#
# NOT RUN LOCALLY: GitHub Actions cannot be executed on a developer machine. This file is linted with
# actionlint (tools/actionlint.py) and checked structurally (tests/test_ci_workflow.py); neither proves
# that a run succeeds. The first run on GitHub is also the first real run of the POSIX-specific tests on
# a Linux host (Phase 1 only simulated Linux in a container). Read its results before trusting any of it.
#
# Semgrep registry rules are under the Semgrep Rules License v1.0 (docs/DECISIONS.md, ADR-001): the
# docker job fetches them fresh inside the job with `secaudit rules update` and nothing here uploads
# or caches them. The strict parity test skips, with a stated reason, if the fetched snapshot
# differs from the one recorded in benchmarks/baseline/manifest.json.
#
# Supply chain: every third-party action is pinned to a full commit SHA (the tag is in the comment and was
# resolved through the GitHub API, then re-verified). Dependabot (.github/dependabot.yml) proposes bumps
# and keeps the tag comments current. The only secrets-adjacent surface is the default read-only token.

name: ci

on:
  # Every branch: push a branch and read CI BEFORE merging it. No branch filter on purpose.
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.13.6"
  PYTHON_VERSION: "3.13"

# Runner images are pinned to explicit labels, never `*-latest`.
#   ubuntu-24.04          Ubuntu 24.04 LTS. `ubuntu-latest` is migrating to Ubuntu 26.04 (rollout from
#                         2026-10-19, issue actions/runner-images#14748); GitHub's advice is to pin.
#   windows-2025-vs2026   Windows Server 2025. This is the image `windows-latest` resolved to in the
#                         first run (run 41680115230 printed "Image: windows-2025-vs2026"), so the pin
#                         keeps the environment the Windows results were produced on.
# Why: the POSIX verification table (docs/PHASE1_NOTES.md) records the exact OS of each run, and a label
# that moves under us makes old evidence and new runs incomparable. Labels come from the "Available
# Images" table in https://github.com/actions/runner-images (checked 2026-11-03).
# To move the pin on purpose: change all three labels below together (two in the matrix, one in the
# docker job), read the new image's release notes, run the branch, then update the OS version and run
# URL in the table in the same commit. The "Set up job" step of every run prints `Image:` and
# `Version:`; copy those. tests/test_ci_workflow.py rejects any `-latest` label.
jobs:
  lint-test:
    name: lint + tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025-vs2026]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: false
      - name: Install (locked)
        run: uv sync --locked
      - name: Ruff check
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .
      - name: actionlint (workflow syntax, expressions, shell)
        if: runner.os == 'Linux'
        run: uv run python tools/actionlint.py
      - name: Ground truth checker
        run: uv run python benchmarks/check_ground_truth.py
      - name: Tests without Docker
        run: uv run pytest -m "not docker" -v -rs

  docker:
    name: docker-marked tests (ubuntu, Linux host)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: false
      - name: Install (locked)
        run: uv sync --locked
      - name: Build the pinned scanner images
        run: uv run secaudit build-images
      - name: Fetch Semgrep rules fresh (never cached, never uploaded)
        run: uv run secaudit rules update
      - name: Docker-marked tests
        run: uv run pytest -m docker -v -rs
      - name: Remove the fetched rules (they must not outlive the job)
        if: always()
        run: rm -rf .secaudit/rules
