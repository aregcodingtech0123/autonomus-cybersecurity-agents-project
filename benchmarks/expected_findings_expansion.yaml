    confidence_in_label: high

  - id: P18
    target: shop_api
    kind: positive
    title: python-multipart 0.0.6 pinned, Content-Type ReDoS reachable from the login form
    file: requirements.txt
    line_start: 8
    line_end: 8
    anchor: python-multipart==0.0.6
    cwe: null
    match:
      - {file: requirements.txt, line_start: 8, line_end: 8, classes: ["vuln:*"]}
    advisories:
      - id: GHSA-2jv5-9r88-3w3p
        aliases: [CVE-2024-24762, PYSEC-2024-38]
        package: python-multipart
        affected: "< 0.0.7"
        source: OSV API
        checked: "2026-11-05"
    rationale: >-
      Source: the Content-Type header of the public POST /auth/token, which declares Form fields. Sink:
      form parsing passes that header to python-multipart's `parse_options_header`, whose regex
      backtracks catastrophically on a crafted value and stalls the worker.
    prior_detectability: {sast: "no", secrets: "no", sca: "yes"}
    context:
      exposure: public
      attacker_input: "yes"
      notes: Availability impact, no login needed.
    confidence_in_label: medium
    label_doubt: >-
      The target was never run. I did not prove that FastAPI 0.115.0 accepts python-multipart 0.0.6 at
      runtime. The pin is vulnerable either way, but reachability rests on reading the libraries'
      behavior, not on a test.

  - id: P19
    target: shop_api
    kind: positive
    title: PyJWT 2.3.0 pinned with a key-confusion advisory that this code does not reach
    file: requirements.txt
    line_start: 9
    line_end: 9
    anchor: PyJWT==2.3.0
    cwe: null
    match:
      - {file: requirements.txt, line_start: 9, line_end: 9, classes: ["vuln:*"]}
    advisories:
      - id: GHSA-ffqj-6fqr-9h24
        aliases: [CVE-2022-29217, PYSEC-2022-202]
        package: PyJWT
        affected: ">= 1.5.0, < 2.4.0"
        source: OSV API
        checked: "2026-11-05"
    rationale: >-
      The pinned version is inside the advisory's affected range, so the dependency is vulnerable as
      declared. The specific attack needs a verifier that accepts both symmetric and asymmetric algorithms.
    prior_detectability: {sast: "no", secrets: "no", sca: "yes"}
    context:
      exposure: public
      attacker_input: "no"
      notes: >-
        Deliberately not reachable: the verified path pins algorithms to HS256, and P14 skips verification
        altogether. A triage agent should keep the finding and lower its priority, citing this.
    confidence_in_label: medium
    label_doubt: >-
      Positive means "ships a package with a known advisory", not "exploitable here". If the scoring should
      only count exploitable issues, this case belongs elsewhere. Kept to test reachability reasoning.

  - id: P20
    target: shop_api
    kind: positive
