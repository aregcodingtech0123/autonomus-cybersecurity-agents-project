[project]
name = "secaudit"
version = "0.1.0"
description = "Multi-agent security audit platform: real scanners find, LLM agents triage."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
secaudit = "secaudit.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/secaudit"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "pre-commit>=3",
    # Used only by benchmarks/check_ground_truth.py (benchmark tooling, not runtime).
    "pyyaml>=6",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# Deliberately vulnerable benchmark code must never be linted, formatted or scanned.
extend-exclude = ["benchmarks/targets"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Never collect tests from the intentionally vulnerable benchmark targets.
addopts = "--ignore=benchmarks/targets"
