[project]
name = "secaudit"
version = "0.1.0"
description = "Multi-agent security audit platform: real scanners find, LLM agents triage."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.20.1",
    "jinja2>=3.1.6",
    "pydantic>=2.7",
    "pyyaml>=6",
    "sqlmodel>=0.0.48",
]

[project.scripts]
secaudit = "secaudit.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/secaudit"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "pre-commit>=3",
    # Used only by benchmarks/check_ground_truth.py (benchmark tooling, not runtime).
    "pyyaml>=6",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# Deliberately vulnerable benchmark code must never be linted, formatted or scanned.
extend-exclude = ["benchmarks/targets"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501", "S101", "S108", "S603", "S607"]
# core/: "/tmp" strings are in-container paths; chmod 0o777/0o755 is deliberate so the
# non-root container user can write the output mount; `git`/`docker` are resolved via PATH.
"src/secaudit/core/**" = ["S103", "S108", "S607"]
"src/secaudit/cli.py" = ["S607"]
# evaluation.py renders Markdown report tables: long string literals are the content, not code.
"src/secaudit/core/evaluation.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Never collect tests from the intentionally vulnerable benchmark targets.
addopts = "--ignore=benchmarks/targets"
