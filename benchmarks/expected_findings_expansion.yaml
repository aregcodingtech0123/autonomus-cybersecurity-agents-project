  - id: P16
    target: shop_api
    kind: positive
    title: FastAPI application created with debug=True
    file: shop/main.py
    line_start: 8
    line_end: 8
    anchor: debug=True
    cwe: CWE-489
    match:
      - {file: shop/main.py, line_start: 8, line_end: 8, cwe: [CWE-489, CWE-215, CWE-94]}
    rationale: >-
      Source: any request that raises an unhandled exception, for example malformed SQL through P12.
