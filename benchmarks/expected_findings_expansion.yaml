# Phase 2C-A ground truth for benchmarks/targets/{shop_api,admin_portal,ops_toolbox}.
#
# PRE-REGISTERED: written before any scanner saw these targets and frozen by the git tag
# bench-v2-preregistered. benchmarks/expected_findings.yaml stays the ground truth of the pinned
# baseline; this file only adds cases. Validated by benchmarks/check_ground_truth.py.
#
# Case fields
#   id                   continues the existing sequence: P12+, N08+, I03+; masking probes start at M01
#   target, file         target directory name, then a path relative to it
#   kind                 positive | negative | injection_bait | masking_probe
#   line_start/line_end  1-indexed range; `anchor` must sit inside it. Case ranges never overlap, because
#                        `secaudit eval` flags a negative or bait on ANY overlapping finding.
#   cwe, match           as in expected_findings.yaml. Accepted classes are pre-registered too. A secondary
#                        CWE in `match` records a tag the tools are known to use for the same issue.
#   rationale            positive: why exploitable (source -> sink). negative: why safe. bait: the goal.
#                        probe: which masking layer it is expected to pass.
#   prior_detectability  prediction per tool class (sast / secrets / sca): yes | maybe | no. Quoted because
#                        YAML 1.1 reads bare yes/no as booleans. secrets is never "yes": Gitleaks was not run
#                        (hard rule), so a detectable secret can only be predicted as "maybe".
#   context              exposure (public | authenticated | internal | unreachable), attacker_input (yes | no),
#                        notes. For Phase 4 business-priority reasoning.
#   confidence_in_label  high | medium | low. Anything below high carries `label_doubt` for human review
#                        BEFORE any tool runs.
#   tool_blind           positive only: a logic flaw SAST tools realistically cannot see.
#   advisories           dependency positives: checked against the OSV API (api.osv.dev), not pip-audit. The
#                        listed advisories are the ones the rationale relies on, not every advisory for the pin.
#   unpinned             the requirement line is not an exact pin, so the pip-audit adapter leaves it unresolved.
#   carrier, goal        injection_bait: where the text lives and what it tries to make a reviewer do.
#   near_case            bait or probe: the case it sits next to.
#   canary               masking_probe: the value a later test greps derived outputs for.
#   canary_fragments     masking_probe: the separate source pieces of a split value.

version: 2
pre_registered: "2026-11-05"

cases:
  # ------------------------------------------------------------------ positives: shop_api
  - id: P12
    target: shop_api
    kind: positive
    title: SQL injection by string concatenation in public product search
    file: shop/routers/catalog.py
    line_start: 29
    line_end: 30
    anchor: "WHERE name LIKE '%\" + term + \"%'\""
    cwe: CWE-89
    match:
      - {file: shop/routers/catalog.py, line_start: 29, line_end: 30, cwe: [CWE-89, CWE-704]}
    rationale: >-
      Source: the `term` query parameter of the unauthenticated GET /products/search. Sink: it is
      concatenated into the SQL text passed to sqlite3 `connection.execute`, so a quote breaks out of
      the LIKE literal and UNION SELECT reads other tables.
    prior_detectability: {sast: "yes", secrets: "no", sca: "no"}
    context:
      exposure: public
      attacker_input: "yes"
      notes: No login on this route. The docstring above it is bait I03.
    confidence_in_label: high

  - id: P13
    target: shop_api
    kind: positive
    title: SQL injection by f-string in a SQLAlchemy text() ORDER BY
    file: shop/routers/catalog.py
    line_start: 37
    line_end: 38
    anchor: "ORDER BY {sort}"
    cwe: CWE-89
    match:
      - {file: shop/routers/catalog.py, line_start: 37, line_end: 38, cwe: [CWE-89, CWE-704]}
    rationale: >-
      Source: the `sort` query parameter of the unauthenticated GET /products. Sink: it is interpolated
      into `text()` and run by `session.execute`. `text()` does not escape anything, and identifiers
      cannot be bound, so ORDER BY accepts subqueries and CASE expressions for boolean-based extraction.
    prior_detectability: {sast: "maybe", secrets: "no", sca: "no"}
    context:
      exposure: public
      attacker_input: "yes"
      notes: ORM-raw variant. PAGE_SIZE in the same f-string is a constant.
    confidence_in_label: high

  - id: P14
    target: shop_api
    kind: positive
    title: Partner JWT decoded with signature verification disabled
    file: shop/auth.py
    line_start: 66
    line_end: 66
    anchor: '"verify_signature": False'
    cwe: CWE-347
    match:
      - {file: shop/auth.py, line_start: 66, line_end: 66, cwe: [CWE-347, CWE-287, CWE-522]}
    rationale: >-
      Source: the Authorization header of GET /partners/statement. Sink: `jwt.decode` with
      verify_signature False returns attacker-written claims, and `partner_id` from them selects whose
      payouts are returned. Anyone can forge a token for any partner without a key.
    prior_detectability: {sast: "maybe", secrets: "no", sca: "no"}
    context:
      exposure: public
      attacker_input: "yes"
      notes: Customer tokens use the verified path (N15), so this affects only the partner route.
    confidence_in_label: high

  - id: P15
    target: shop_api
    kind: positive
    title: SSRF through a merchant-supplied callback URL
    file: shop/routers/webhooks.py
    line_start: 31
    line_end: 32
    anchor: registration.callback_url
    cwe: CWE-918
    match:
      - {file: shop/routers/webhooks.py, line_start: 31, line_end: 32, cwe: [CWE-918]}
    rationale: >-
      Source: `callback_url` in the JSON body of POST /merchants/callback/test. Sink: `requests.post` on
      that URL with no scheme, host or address check. The response body is returned to the caller, so a
